services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  ml:
    build: ./ml-service
    ports:
      - "5001:5001"

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/mediconnect
      ML_URL: http://ml:5001
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ml

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data: